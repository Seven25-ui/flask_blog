<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SE7EN • Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Orbitron:wght@900&display=swap" rel="stylesheet">
    <style>
        :root { --bg-deep: #000000; --sky-accent: #0ea5e9; }
        body { 
            background-color: var(--bg-deep); 
            color: #f1f5f9; 
            font-family: 'Inter', sans-serif;
            background-image: radial-gradient(circle at top right, #0ea5e910, transparent 400px);
        }
        .brand-font { font-family: 'Orbitron', sans-serif; letter-spacing: 0.2em; }
        
        .glass-panel {
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid #1f2937;
        }

        .custom-input {
            background-color: #000000;
            border: 1px solid #1f2937;
            transition: all 0.3s ease;
        }
        .custom-input:focus {
            border-color: #0ea5e9;
            box-shadow: 0 0 0 1px #0ea5e9;
            outline: none;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6 selection:bg-sky-500/30">

    <div class="max-w-md w-full glass-panel p-10 rounded-[2.5rem] shadow-2xl animate-in fade-in zoom-in duration-500">
        
        <div class="text-center mb-10">
            <h1 class="brand-font text-3xl text-sky-500 font-black mb-2">SE7EN</h1>
            <p class="text-[10px] font-black uppercase tracking-[0.3em] text-gray-500">Secure Entry Point</p>
        </div>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="bg-red-500/10 text-red-400 p-4 rounded-2xl text-xs mb-6 border border-red-500/20 font-bold flex items-center gap-3">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" class="space-y-6">
            <div class="space-y-2">
                <label class="block text-[10px] font-black uppercase tracking-widest text-gray-500 ml-1">Identity</label>
                <input type="text" name="username" required
                       class="w-full px-5 py-4 rounded-2xl custom-input text-white placeholder:text-gray-700"
                       placeholder="Username">
            </div>

            <div class="space-y-2 text-right">
                <label class="block text-left text-[10px] font-black uppercase tracking-widest text-gray-500 ml-1">Access Key</label>
                <div class="relative">
                    <input type="password" name="password" id="loginPassword" required
                           class="w-full px-5 py-4 rounded-2xl custom-input text-white placeholder:text-gray-700"
                           placeholder="••••••••">
                </div>
                
                <div class="mt-3 flex items-center justify-between px-1">
                    <div class="flex items-center">
                        <input type="checkbox" id="showLoginPw" onclick="toggleLoginPassword()"
                               class="w-4 h-4 rounded border-gray-800 bg-black text-sky-500 focus:ring-sky-500 focus:ring-offset-black cursor-pointer">
                        <label for="showLoginPw" class="ml-2 text-[10px] font-black uppercase tracking-wider text-gray-600 cursor-pointer select-none hover:text-gray-400 transition-colors">
                            Reveal Key
                        </label>
                    </div>
                    <a href="#" class="text-[10px] font-black uppercase tracking-wider text-gray-600 hover:text-sky-500 transition-colors">Recovery</a>
                </div>
            </div>

            <button type="submit"
                    class="w-full bg-sky-500 hover:bg-sky-400 text-white font-black py-5 rounded-2xl shadow-xl shadow-sky-500/10 transition-all transform active:scale-[0.98] uppercase text-xs tracking-[0.2em] mt-4">
                Authenticate
            </button>
        </form>

        <div class="mt-10 text-center border-t border-gray-900 pt-8">
            <p class="text-xs font-bold text-gray-600 tracking-wide">
                New to the system? 
                <a href="{{ url_for('register') }}" class="text-sky-500 hover:text-sky-400 ml-1 transition-colors underline decoration-2 underline-offset-4">Register Account</a>
            </p>
        </div>
    </div>

    <script>
        function toggleLoginPassword() {
            const pwInput = document.getElementById('loginPassword');
            pwInput.type = pwInput.type === "password" ? "text" : "password";
        }
    </script>
</body>
</html>
