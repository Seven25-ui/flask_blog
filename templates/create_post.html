<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ 'Edit Post' if post else 'Create New Post' }} • SE7EN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Orbitron:wght@900&display=swap" rel="stylesheet">

    <style>
        :root { --bg-deep: #000000; --sky-accent: #0ea5e9; }
        body { background-color: var(--bg-deep); color: #f1f5f9; font-family: 'Inter', sans-serif; }
        
        .brand-font { font-family: 'Orbitron', sans-serif; letter-spacing: 0.15em; }
        
        /* Custom Input Styling */
        .custom-input {
            background-color: #000000;
            border: 1px solid #1f2937;
            transition: all 0.3s ease;
        }
        .custom-input:focus {
            border-color: #0ea5e9;
            box-shadow: 0 0 0 1px #0ea5e9;
            outline: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-form { animation: fadeIn 0.5s ease-out forwards; }
    </style>
</head>
<body class="selection:bg-sky-500/30">

    <main class="max-w-2xl mx-auto min-h-screen border-x border-gray-800 pb-20 bg-black">
        
        <div class="sticky top-0 z-40 bg-black/80 backdrop-blur-xl p-4 flex items-center gap-6 border-b border-gray-800">
            <a href="{{ url_for('dashboard') }}" class="p-2 hover:bg-gray-800 rounded-full transition-all active:scale-90 text-sky-500">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
            </a>
            <div>
                <h2 class="font-black text-lg leading-none tracking-tight uppercase brand-font text-sky-500">
                    {{ 'Edit Story' if post else 'New Story' }}
                </h2>
            </div>
        </div>

        <div class="p-4 sm:p-8 animate-form">
            <form method="POST" enctype="multipart/form-data" class="space-y-8">
                
                <div class="space-y-2">
                    <label class="text-[10px] font-black uppercase tracking-widest text-gray-500 ml-1">Title of Story</label>
                    <input type="text" name="title" placeholder="Enter headline..." required 
                           value="{{ post.title if post else '' }}"
                           class="w-full p-4 custom-input rounded-2xl text-white font-black text-xl placeholder:text-gray-700">
                </div>

                <div class="space-y-2">
                    <label class="text-[10px] font-black uppercase tracking-widest text-gray-500 ml-1">The Narrative</label>
                    <textarea name="content" placeholder="Write your thoughts..." rows="12" required
                              class="w-full p-4 custom-input rounded-2xl text-gray-300 leading-relaxed placeholder:text-gray-700 resize-none">{{ post.content if post else '' }}</textarea>
                </div>

                <div class="space-y-2">
                    <label class="text-[10px] font-black uppercase tracking-widest text-gray-500 ml-1">Visual Media</label>
                    <div class="border-2 border-dashed border-gray-800 rounded-3xl p-6 bg-black/50 hover:border-sky-500/50 transition-all group text-center">
                        
                        {% if post and post.media_file %}
                        <div class="mb-6">
                            <p class="text-[9px] font-black text-sky-500 uppercase mb-3">Currently Attached:</p>
                            <div class="relative inline-block rounded-2xl overflow-hidden border border-gray-800">
                                {% if post.media_type == 'video' %}
                                    <video class="h-44 w-full object-cover" src="{{ post.media_file }}" controls></video>
                                {% else %}
                                    <img class="h-44 w-full object-cover" src="{{ post.media_file }}">
                                {% endif %}
                            </div>
                        </div>
                        {% endif %}

                        <label class="cursor-pointer block">
                            <div class="flex flex-col items-center justify-center space-y-3">
                                <div class="p-4 bg-gray-900 rounded-full text-sky-500 group-hover:bg-sky-500 group-hover:text-white transition-all">
                                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                                </div>
                                <div class="text-xs font-bold text-gray-500 group-hover:text-gray-300">
                                    {{ 'Replace image or video' if post else 'Click to upload media' }}
                                </div>
                            </div>
                            <input type="file" name="media_file" accept="image/*,video/*" class="hidden">
                        </label>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-[10px] font-black uppercase tracking-widest text-gray-500 ml-1">Tags</label>
                    <input type="text" name="hashtags" placeholder="cebu, life, travel..."
                           value="{{ post.hashtags if post else '' }}"
                           class="w-full p-4 custom-input rounded-2xl text-sky-400 font-bold text-sm">
                    <p class="text-[10px] text-gray-600 italic ml-1 italic">Separate tags with commas (,)</p>
                </div>

                <div class="pt-6 grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <button type="submit" class="p-4 bg-sky-500 hover:bg-sky-400 text-white font-black rounded-2xl transition-all shadow-lg shadow-sky-500/20 uppercase text-xs tracking-widest active:scale-95">
                        {{ 'Update Story' if post else 'Publish Now' }}
                    </button>
                    <a href="{{ url_for('dashboard') }}" class="p-4 bg-gray-900 hover:bg-gray-800 text-gray-400 text-center font-black rounded-2xl transition-all uppercase text-xs tracking-widest">
                        Discard
                    </a>
                </div>

            </form>
        </div>
    </main>

    <script>
        // Force dark mode
        document.documentElement.classList.add('dark');
        
        // Simple file selection feedback
        const fileInput = document.querySelector('input[type="file"]');
        fileInput.addEventListener('change', function() {
            if (this.files.length > 0) {
                const label = this.previousElementSibling.querySelector('.text-xs');
                label.innerText = "Selected: " + this.files[0].name;
                label.classList.add('text-sky-500');
            }
        });
    </script>
</body>
</html>
