<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit: {{ post.title }} | SE7EN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Orbitron:wght@900&display=swap" rel="stylesheet">
    
    <style>
        :root { --bg-deep: #000000; --sky-accent: #0ea5e9; }
        body { background-color: var(--bg-deep); color: #f1f5f9; font-family: 'Inter', sans-serif; }
        
        .brand-font { font-family: 'Orbitron', sans-serif; letter-spacing: 0.15em; }
        .text-brand-gradient { background: linear-gradient(45deg, #0ea5e9, #60a5fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        @keyframes brandPulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 0px rgba(14, 165, 233, 0)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 10px rgba(14, 165, 233, 0.6)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 0px rgba(14, 165, 233, 0)); }
        }
        .animate-pulse-brand { animation: brandPulse 3s infinite ease-in-out; display: inline-block; }

        input, textarea { background: #0f172a !important; border: 1px solid #1e293b !important; transition: all 0.3s ease; }
        input:focus, textarea:focus { border-color: #0ea5e9 !important; box-shadow: 0 0 0 2px rgba(14, 165, 233, 0.2); outline: none; }
    </style>
</head>
<body class="selection:bg-sky-500/30">

<header class="sticky top-0 z-50 bg-black/80 backdrop-blur-xl border-b border-gray-800">
    <div class="max-w-4xl mx-auto px-4 h-16 flex justify-between items-center">
        <a href="{{ url_for('dashboard') }}" class="flex items-center gap-2 group text-gray-400 hover:text-sky-500 transition-all font-bold text-sm">
            <span class="text-xl transition-transform group-hover:-translate-x-1">←</span>
            <span>Dashboard</span>
        </a>

        <div class="flex flex-col items-center">
            <span class="brand-font text-xl font-black text-brand-gradient italic animate-pulse-brand">SE7EN</span>
        </div>

        <div class="flex items-center gap-4">
            <a href="{{ url_for('logout') }}" class="text-red-500 hover:text-red-400 font-bold text-xs uppercase tracking-widest">Logout</a>
        </div>
    </div>
</header>

<main class="max-w-2xl mx-auto p-6 mt-8">
    <div class="bg-gray-900/40 border border-gray-800 rounded-[2.5rem] p-8 backdrop-blur-sm shadow-2xl">
        <div class="mb-8">
            <h1 class="text-2xl font-black text-white">Edit Post</h1>
            <p class="text-gray-500 text-sm">Refine your story for the community.</p>
        </div>

        <form method="POST" enctype="multipart/form-data" class="space-y-6">
            <div>
                <label class="block text-xs font-black uppercase tracking-widest text-gray-400 mb-2">Post Title</label>
                <input type="text" name="title" value="{{ post.title }}" required
                       class="w-full p-4 rounded-2xl text-gray-100 placeholder-gray-600 font-bold">
            </div>

            <div>
                <label class="block text-xs font-black uppercase tracking-widest text-gray-400 mb-2">Content</label>
                <textarea name="content" rows="10" required
                          class="w-full p-4 rounded-2xl text-gray-100 placeholder-gray-600 leading-relaxed">{{ post.content }}</textarea>
            </div>

            <div class="p-6 bg-black/40 border border-gray-800 rounded-3xl">
                <label class="block text-xs font-black uppercase tracking-widest text-sky-500 mb-4">Media Assets</label>

                {% if post.media_file %}
                    <div class="mb-6 relative group inline-block">
                        <p class="text-[10px] text-gray-500 mb-2 font-bold uppercase">Current Preview:</p>
                        <div class="rounded-xl overflow-hidden border border-gray-700">
                            {% if post.media_type == 'video' %}
                                <video src="{{ post.media_file }}" controls class="w-48 aspect-video object-cover bg-black"></video>
                            {% else %}
                                <img src="{{ post.media_file }}" class="w-48 h-32 object-cover">
                            {% endif %}
                        </div>
                    </div>
                {% endif %}

                <div class="relative group">
                    <input type="file" name="media_file" accept="image/*,video/*"
                           class="block w-full text-sm text-gray-500 
                                  file:mr-4 file:py-2 file:px-6 
                                  file:rounded-full file:border-0 
                                  file:text-xs file:font-black file:uppercase
                                  file:bg-sky-500 file:text-white
                                  hover:file:bg-sky-400 file:transition-all
                                  cursor-pointer">
                    <p class="text-[10px] text-gray-600 mt-3 font-bold italic tracking-wide">* Upload new media to replace the current one.</p>
                </div>
            </div>

            <div class="flex flex-col sm:flex-row gap-4 pt-4">
                <button type="submit" class="flex-1 px-8 py-4 bg-sky-500 hover:bg-sky-400 text-white font-black rounded-2xl shadow-lg shadow-sky-500/20 transition-all active:scale-95 uppercase tracking-widest text-sm">
                    Save Changes
                </button>
                <a href="{{ url_for('dashboard') }}" class="px-8 py-4 bg-gray-900 text-gray-400 hover:text-white font-black rounded-2xl border border-gray-800 text-center transition-all uppercase tracking-widest text-sm">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</main>

<footer class="text-center py-12 text-gray-600 text-[10px] font-black tracking-[0.3em] uppercase">
    &copy; 2026 <span class="text-sky-500 text-brand-gradient">SE7EN</span> • ALL RIGHTS RESERVED
</footer>

<script>
    // Ensure Dark Mode is active
    document.documentElement.classList.add('dark');
</script>

</body>
</html>
