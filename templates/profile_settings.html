<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings • SE7EN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Orbitron:wght@900&display=swap" rel="stylesheet">
    
    <style>
        :root { --bg-deep: #000000; --sky-accent: #0ea5e9; }
        body { background-color: var(--bg-deep); color: #f1f5f9; font-family: 'Inter', sans-serif; }
        
        .brand-font { font-family: 'Orbitron', sans-serif; letter-spacing: 0.15em; }
        .text-brand-gradient { background: linear-gradient(45deg, #0ea5e9, #60a5fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .glass-card { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        
        input[type="file"]::-webkit-file-upload-button {
            background: #0ea5e9; color: white; border: none; padding: 8px 16px;
            border-radius: 12px; font-weight: 900; text-transform: uppercase;
            font-size: 10px; letter-spacing: 0.1em; cursor: pointer; transition: 0.3s;
        }
        input[type="file"]::-webkit-file-upload-button:hover { background: #38bdf8; }

        textarea, input[type="text"] { background: #0a0a0a !important; border: 1px solid #1e293b !important; }
        textarea:focus { border-color: #0ea5e9 !important; outline: none; box-shadow: 0 0 15px rgba(14, 165, 233, 0.1); }
    </style>
</head>
<body class="p-4 md:p-8 selection:bg-sky-500/30">

    <div class="max-w-xl mx-auto">
        <div class="flex items-center justify-between mb-8">
            <a href="{{ url_for('dashboard') }}" class="p-3 bg-gray-900 rounded-2xl text-sky-500 hover:bg-sky-500 hover:text-white transition-all shadow-lg border border-gray-800 group">
                <svg class="w-5 h-5 transition-transform group-hover:-translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
            </a>
            <h2 class="brand-font text-2xl font-black text-brand-gradient italic">SETTINGS</h2>
            <div class="w-10"></div> </div>

        <div class="glass-card p-6 sm:p-10 rounded-[3rem] shadow-2xl relative overflow-hidden">
            <div class="absolute -top-24 -right-24 w-48 h-48 bg-sky-500/10 blur-[100px] rounded-full"></div>

            <div class="flex flex-col items-center mb-10">
                <div class="w-full h-40 rounded-[2rem] bg-gray-950 overflow-hidden relative mb-[-3.5rem] border border-gray-800 shadow-inner">
                    <img id="preview_bg" src="{{ user.background_pic if user.background_pic else 'https://images.unsplash.com/photo-1614850523296-d8c1af93d400?q=80&w=1000&auto=format&fit=crop' }}"
                         class="w-full h-full object-cover opacity-60">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent"></div>
                    <p class="absolute top-4 left-4 text-[9px] bg-sky-500 text-white px-3 py-1 rounded-full uppercase font-black tracking-widest">Banner Live Preview</p>
                </div>

                <div class="relative">
                    <div class="absolute -inset-1 bg-sky-500 rounded-full blur opacity-25"></div>
                    <img id="preview_img" src="{{ user.profile_pic if user.profile_pic else 'https://ui-avatars.com/api/?name=' + user.username }}"
                         class="relative w-28 h-28 rounded-full object-cover border-4 border-black shadow-2xl">
                </div>
                <p class="mt-4 text-xs font-black text-sky-500 uppercase tracking-[0.2em]">@{{ user.username }}</p>
            </div>

            <form method="POST" enctype="multipart/form-data" class="space-y-8">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-[10px] font-black text-gray-500 mb-3 uppercase tracking-widest">Background Banner</label>
                        <input type="file" name="background_pic" id="bg_input" accept="image/*"
                               class="w-full text-[10px] text-gray-400">
                    </div>

                    <div>
                        <label class="block text-[10px] font-black text-gray-500 mb-3 uppercase tracking-widest">Profile Photo</label>
                        <input type="file" name="profile_pic" id="profile_input" accept="image/*"
                               class="w-full text-[10px] text-gray-400">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-black text-gray-500 mb-3 uppercase tracking-widest">Bio / Story</label>
                    <textarea name="bio" rows="4" placeholder="Tell your story..."
                              class="w-full p-5 rounded-3xl text-gray-200 leading-relaxed transition-all">{{ user.bio or '' }}</textarea>
                </div>

                <button type="submit"
                        class="w-full bg-sky-500 hover:bg-sky-400 text-white font-black py-5 rounded-2xl shadow-xl shadow-sky-500/20 transform active:scale-[0.98] transition-all uppercase tracking-[0.2em] text-xs">
                    Update Identity
                </button>
            </form>

            <div class="mt-12 pt-8 border-t border-gray-800/50">
                <h3 class="text-[10px] font-black text-gray-600 uppercase tracking-widest mb-6">Security Access</h3>
                <a href="{{ url_for('change_password') }}"
                   class="group flex items-center justify-between w-full p-5 bg-black/40 border border-gray-800 rounded-3xl hover:border-sky-500/50 transition-all duration-500">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-2xl bg-gray-900 flex items-center justify-center text-xl group-hover:scale-110 transition-transform">🔐</div>
                        <div class="text-left">
                            <p class="text-xs font-black uppercase tracking-widest text-white">Change Password</p>
                            <p class="text-[9px] text-gray-500 font-bold mt-1">Enhance your account shield</p>
                        </div>
                    </div>
                    <div class="w-8 h-8 rounded-full flex items-center justify-center border border-gray-800 group-hover:bg-sky-500 group-hover:border-sky-500 transition-all">
                        <svg class="w-4 h-4 text-gray-500 group-hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7"/></svg>
                    </div>
                </a>
            </div>

            <div class="mt-10 text-center">
                <a href="{{ url_for('dashboard') }}" class="text-[10px] font-black text-gray-600 hover:text-sky-500 transition-colors uppercase tracking-[0.3em]">
                    &larr; Exit to Dashboard
                </a>
            </div>
        </div>
    </div>

    <script>
        document.documentElement.classList.add('dark');

        const profileInput = document.getElementById('profile_input');
        const previewImg = document.getElementById('preview_img');
        profileInput.onchange = evt => {
            const [file] = profileInput.files;
            if (file) previewImg.src = URL.createObjectURL(file);
        }

        const bgInput = document.getElementById('bg_input');
        const previewBg = document.getElementById('preview_bg');
        bgInput.onchange = evt => {
            const [file] = bgInput.files;
            if (file) previewBg.src = URL.createObjectURL(file);
        }
    </script>
</body>
</html>
