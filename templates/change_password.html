<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SE7EN • Security Update</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Orbitron:wght@900&display=swap" rel="stylesheet">
    <style>
        :root { --sky-accent: #0ea5e9; }
        body { 
            background-color: #000000; 
            color: #f1f5f9; 
            font-family: 'Inter', sans-serif;
            background-image: radial-gradient(circle at top, #0ea5e915, transparent 500px);
        }
        .brand-font { font-family: 'Orbitron', sans-serif; letter-spacing: 0.1em; }
        .glass-panel {
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid #1f2937;
        }
        .custom-input {
            background-color: #080808;
            border: 1px solid #1f2937;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .custom-input:focus {
            border-color: var(--sky-accent);
            box-shadow: 0 0 15px rgba(14, 165, 233, 0.1);
            outline: none;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full glass-panel p-10 rounded-[2.5rem] shadow-2xl animate-in fade-in zoom-in duration-500">
        
        <div class="mb-8">
            <h2 class="brand-font text-xl text-sky-500 font-black tracking-tighter uppercase">Security Protocol</h2>
            <p class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mt-1">Rotate Access Credentials</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
                <div class="mb-6 p-4 rounded-2xl text-[11px] font-bold border flex items-center gap-3
                    {{ 'bg-red-500/10 text-red-400 border-red-500/20' if category == 'error' else 'bg-green-500/10 text-green-400 border-green-500/20' }}">
                    <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    {{ message }}
                </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" class="space-y-6">
            <div class="space-y-2">
                <label class="block text-[10px] font-black uppercase tracking-widest text-gray-500 ml-1">Current Key</label>
                <input type="password" name="old_password" required
                       class="w-full px-5 py-4 rounded-2xl custom-input text-white placeholder:text-gray-800 text-sm"
                       placeholder="••••••••">
            </div>

            <div class="space-y-2">
                <label class="block text-[10px] font-black uppercase tracking-widest text-gray-500 ml-1">New System Key</label>
                <input type="password" name="new_password" required
                       class="w-full px-5 py-4 rounded-2xl custom-input text-white placeholder:text-gray-800 text-sm"
                       placeholder="Min. 8 characters">
            </div>

            <div class="space-y-2">
                <label class="block text-[10px] font-black uppercase tracking-widest text-gray-500 ml-1">Verify New Key</label>
                <input type="password" name="confirm_password" required
                       class="w-full px-5 py-4 rounded-2xl custom-input text-white placeholder:text-gray-800 text-sm"
                       placeholder="••••••••">
            </div>

            <div class="pt-4 space-y-4">
                <button type="submit" 
                        class="w-full bg-sky-500 hover:bg-sky-400 text-white font-black py-5 rounded-2xl shadow-lg shadow-sky-500/10 transition-all transform active:scale-[0.98] uppercase text-xs tracking-[0.2em]">
                    Commit Changes
                </button>
                
                <div class="text-center">
                    <a href="{{ url_for('profile_settings') }}" 
                       class="text-[10px] font-black uppercase tracking-[0.2em] text-gray-600 hover:text-gray-400 transition-colors">
                        Abourt Mission
                    </a>
                </div>
            </div>
        </form>
    </div>

</body>
</html>
